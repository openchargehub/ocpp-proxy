name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-llvm-cov

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Domain coverage
        # 99 rather than 100: serde_json::Number::as_f64 has an unreachable None
        # for every number this parser can build. Lines and regions otherwise match.
        run: cargo +nightly llvm-cov -p ocpp-proxy-domain --branch --fail-under-lines 99 --fail-under-regions 99

      - name: Workspace coverage
        run: cargo llvm-cov --workspace --fail-under-lines 90
